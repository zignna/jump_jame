
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>런또키!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <h1>🐰 런또키!</h1>
    <p>점프해서 장애물을 피하고 코인을 모으세요!</p>

    <div class="currency">
      🪙 보유 코인: <span id="coins">0</span>
    </div>

    <div id="game">
      <div id="worldLabel">🌼 초원 세계</div>
      <div id="player">🐰</div>
      <div id="ground"></div>
      <div id="gameObjects"></div>
      <div id="message">화면을 클릭해서 시작!</div>
    </div>

    <div class="info">
      <span>점수: <span id="score">0</span></span>
      <span>최고 점수: <span id="best">0</span></span>
    </div>

    <button id="restart">🔄 다시 시작</button>

    <h2>🎨 스킨 상점</h2>
    <p>코인을 모아서 새로운 캐릭터를 구매하세요!</p>

    <div id="shop" class="shop"></div>

    
    <h2>🌈 배경 상점</h2>
    <p>코인을 모아서 나만의 세계를 꾸며보세요!</p>

    <div id="backgroundShop" class="shop"></div>


    <p class="help">
      PC: 스페이스바 / ↑ 키<br>
      모바일: 화면 터치
    </p>
  </div>

  <script src="game.js"></script>
</body>
</html>
